# Every push to main that contains releasable Conventional Commits (feat, fix, perf,
# refactor, revert, or breaking changes) produces a new version: the version is computed
# from the commit messages, the Windows installer + portable app are built, and a
# GitHub release with notes and auto-update metadata is published. Run it manually
# (Actions > Release > Run workflow) to force a patch/minor/major release.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derived from commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      releasable: ${{ steps.next.outputs.releasable }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: next
        run: node scripts/next-version.mjs "${{ github.event.inputs.bump || 'auto' }}" --github-output
      - name: Summary
        run: |
          echo "### Release ${{ steps.next.outputs.version }} (releasable: ${{ steps.next.outputs.releasable }})" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Windows release
    needs: version
    if: needs.version.outputs.releasable == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Build installer and portable app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional Authenticode signing: add a base64 .pfx as WIN_CSC_LINK and its password as WIN_CSC_KEY_PASSWORD.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Synth Piano ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.version.outputs.notes }}
          files: dist/*
          make_latest: 'true'
